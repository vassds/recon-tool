services:

  postgres:
    image: postgres:16-alpine
    container_name: recon-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recon_platform}
      POSTGRES_USER: ${POSTGRES_USER:-recon_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-recon_user} -d ${POSTGRES_DB:-recon_platform}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: recon-redis
    restart: unless-stopped

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: recon-backend
    restart: unless-stopped

    ports:
      - "28000:8000"

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-recon_platform}
      POSTGRES_USER: ${POSTGRES_USER:-recon_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      SECRET_KEY: ${SECRET_KEY:-change_me_to_a_random_secret_key_in_production}

      MAX_CONCURRENT_SCANS: ${MAX_CONCURRENT_SCANS:-5}
      MAX_REQUESTS_PER_SECOND: ${MAX_REQUESTS_PER_SECOND:-50}
      SCAN_TIMEOUT: ${SCAN_TIMEOUT:-300}

      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      CENSYS_API_KEY: ${CENSYS_API_KEY:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      SECURITYTRAILS_API_KEY: ${SECURITYTRAILS_API_KEY:-}

    volumes:
      - scan_results:/app/reports

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: recon-worker
    restart: unless-stopped

    command:
      - celery
      - -A
      - app.workers.celery_app
      - worker
      - -l
      - info
      - -c
      - "4"

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-recon_platform}
      POSTGRES_USER: ${POSTGRES_USER:-recon_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      SECRET_KEY: ${SECRET_KEY:-change_me_to_a_random_secret_key_in_production}

      MAX_CONCURRENT_SCANS: ${MAX_CONCURRENT_SCANS:-5}
      MAX_REQUESTS_PER_SECOND: ${MAX_REQUESTS_PER_SECOND:-50}
      SCAN_TIMEOUT: ${SCAN_TIMEOUT:-300}

      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      CENSYS_API_KEY: ${CENSYS_API_KEY:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      SECURITYTRAILS_API_KEY: ${SECURITYTRAILS_API_KEY:-}

    volumes:
      - scan_results:/app/reports

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: recon-frontend
    restart: unless-stopped

    ports:
      - "23000:80"

    depends_on:
      - backend


volumes:
  postgres_data:
  redis_data:
  scan_results: